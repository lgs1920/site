<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LGS1920 Studio Layers drawer</title>
  <desc id="desc">A screenshot-style illustration of the Studio Layers drawer with the layer disclaimer button, the layers list, and a source visibility switch highlighted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#16243e"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#8ca3c7" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="48" width="1480" height="804" rx="28" fill="#0b1220"/>
    <rect x="60" y="48" width="1480" height="58" rx="28" fill="#111827"/>
    <rect x="60" y="84" width="1480" height="22" fill="#111827"/>

    <g fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">
      <text x="98" y="84">Studio</text>
      <text x="142" y="84">Map</text>
      <text x="194" y="84">Journey</text>
      <text x="275" y="84">Widgets</text>
      <text x="362" y="84" fill="#e2e8f0">Layers</text>
    </g>

    <rect x="60" y="106" width="994" height="746" fill="#0d1626"/>
    <g opacity=".35">
      <circle cx="358" cy="342" r="170" fill="#1d4ed8"/>
      <circle cx="478" cy="470" r="248" fill="#38bdf8" fill-opacity=".14"/>
      <path d="M170 590C292 514 412 534 534 566s208 14 300-56" stroke="#94a3b8" stroke-opacity=".4" stroke-width="6" fill="none"/>
      <path d="M186 660C334 602 404 618 536 662s198 38 286-18" stroke="#f8fafc" stroke-opacity=".2" stroke-width="4" fill="none"/>
    </g>
    <g opacity=".45">
      <circle cx="260" cy="252" r="7" fill="#f59e0b"/>
      <circle cx="492" cy="318" r="7" fill="#22c55e"/>
      <circle cx="736" cy="524" r="7" fill="#f97316"/>
      <circle cx="472" cy="626" r="7" fill="#eab308"/>
    </g>

    <rect x="1054" y="106" width="486" height="746" fill="url(#drawer)"/>
    <rect x="1054" y="106" width="486" height="64" fill="#ffffff"/>
    <text x="1096" y="147" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Map layers</text>
    <rect x="1410" y="120" width="92" height="36" rx="10" fill="#e11d48"/>
    <text x="1456" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">i</text>
    <circle cx="1457" cy="138" r="20" fill="#fef2f2" stroke="#fecaca"/>
    <path d="M1457 128v22M1457 156h0" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>

    <rect x="1092" y="198" width="410" height="54" rx="14" fill="url(#panel)" stroke="#dbe4f0"/>
    <circle cx="1120" cy="225" r="13" fill="#2563eb"/>
    <path d="M1114 225l5 5 10-12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1146" y="221" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Base layers</text>
    <text x="1146" y="240" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">Choose the map foundation used in the scene.</text>

    <rect x="1092" y="272" width="410" height="102" rx="14" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="1118" y="302" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">OpenStreetMap</text>
    <text x="1118" y="326" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">Free, general purpose reference map.</text>
    <rect x="1342" y="292" width="118" height="26" rx="13" fill="#dbeafe"/>
    <text x="1401" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Visible</text>
    <rect x="1336" y="325" width="130" height="20" rx="10" fill="#e2e8f0"/>
    <rect x="1401" y="325" width="64" height="20" rx="10" fill="#22c55e"/>

    <rect x="1092" y="392" width="410" height="102" rx="14" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="1118" y="422" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Terrain</text>
    <text x="1118" y="446" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">Height data shown alongside the scene.</text>
    <rect x="1338" y="414" width="126" height="30" rx="15" fill="#e2e8f0"/>
    <circle cx="1360" cy="429" r="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1414" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">Off</text>
    <text x="1118" y="470" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">Requires a valid source token when protected.</text>

    <rect x="1092" y="532" width="410" height="184" rx="14" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="1118" y="563" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">OSM Standard</text>
    <text x="1118" y="587" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">Base layer selected for the current scene.</text>
    <rect x="1118" y="608" width="360" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1140" y="635" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f172a">Layer disclaimer</text>
    <rect x="1350" y="614" width="98" height="30" rx="15" fill="#fefce8" stroke="#fde68a"/>
    <text x="1399" y="634" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#a16207">Open</text>
    <text x="1118" y="685" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">Read source notes before changing the scene foundation.</text>

    <rect x="1092" y="730" width="410" height="88" rx="14" fill="#0f172a"/>
    <text x="1118" y="761" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">Use this drawer when you need to change the map foundation or review access notes.</text>
    <text x="1118" y="787" font-family="Inter, Arial, sans-serif" font-size="14" fill="#93c5fd">Back to Drawers</text>
  </g>
</svg>
