<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" class="wa-theme-lgs1920 wa-brand-brown" data-fa-kit-code="eb5c406148">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title | default: site.name | escape }}</title>
    <meta name="description" content="{{ description | default: site.description | escape }}">
    <script>
        (() => {
            const root = document.documentElement
            const theme = localStorage.getItem('theme')
            const seasonTheme = localStorage.getItem('seasonTheme')
            const storedBrandColor = localStorage.getItem('brandColor') || 'brown'
            const allowedBrandColors = new Set(['yellow', 'orange', 'red', 'pink', 'purple', 'blue', 'green', 'brown', 'gray'])
            const allowedThemes = new Set(['light', 'dark', 'system'])
            const allowedSeasonThemes = new Set(['spring', 'summer', 'fall', 'winter'])
            const brandColor = allowedBrandColors.has(storedBrandColor) ? storedBrandColor : 'brown'
            const selectedTheme = allowedThemes.has(theme)
                ? theme
                : (allowedSeasonThemes.has(theme) ? 'system' : 'system')
            const selectedSeasonTheme = allowedSeasonThemes.has(seasonTheme)
                ? seasonTheme
                : (allowedSeasonThemes.has(theme) ? theme : 'summer')
            const effectiveMode = selectedTheme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : (selectedTheme === 'dark' ? 'dark' : 'light')
            const prefixesToReset = ['sl-theme-', 'wa-brand-', 'wa-palette-', 'wa-neutral-', 'wa-success-', 'wa-warning-', 'wa-danger-']
            const classesToRemove = Array.from(root.classList).filter((className) => {
                if (className === 'wa-theme-premium') {
                    return true
                }

                if (className.startsWith('wa-theme-') && className !== 'wa-theme-lgs1920') {
                    return true
                }

                return prefixesToReset.some(prefix => className.startsWith(prefix))
            })

            if (classesToRemove.length > 0) {
                root.classList.remove(...classesToRemove)
            }

            root.classList.add('wa-theme-lgs1920', `wa-brand-${brandColor}`)
            root.classList.toggle('wa-dark', effectiveMode === 'dark')
            root.classList.toggle('wa-light', effectiveMode !== 'dark')
            root.dataset.themeMode = effectiveMode
            root.dataset.themeSelection = selectedTheme
            root.dataset.seasonTheme = selectedSeasonTheme
            root.dataset.brandColor = brandColor
        })()
    </script>
    <script type="module" src="/src/assets/app.js"></script>
</head>
<body>
    {{ content }}
</body>
</html>
