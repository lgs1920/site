<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" class="wa-theme-shoelace wa-brand-yellow" data-fa-kit-code="eb5c406148">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title | default: site.name | escape }}</title>
    <meta name="description" content="{{ description | default: site.description | escape }}">
    <script>
        (() => {
            const mode = localStorage.getItem('theme') || 'system'
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')
            const isDark = mode === 'dark' || (mode === 'system' && mediaQuery.matches)

            document.documentElement.classList.toggle('wa-dark', isDark)
            document.documentElement.classList.toggle('wa-light', !isDark)
            document.documentElement.dataset.themeMode = mode
        })()
    </script>
    <script type="module" src="/src/assets/app.js"></script>
</head>
<body>
    {{ content }}
</body>
</html>
